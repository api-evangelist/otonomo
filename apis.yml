aid: otonomo
name: Otonomo
description: >-
  Otonomo operates a connected-vehicle data platform that aggregates, normalizes
  and delivers telematics and mobility data from millions of connected cars to
  fleets, insurers, cities and mobility developers. Its Fleet ("Personal Data for
  Fleets") API exposes OAuth2-secured endpoints for vehicle onboarding (VIN
  upload / enablement / consent), near-real-time vehicle status, historical fleet
  points and trips reporting, connectivity checks, an attribute explorer, custom
  event rules with callbacks, and a streaming interface — across separate US and
  EU data regions. Otonomo was acquired by Urgently (Urgent.ly) in 2023; the
  connected-car Fleet data API remains operational and documented on ReadMe at
  docs.otonomo.io. Originally surfaced as a Bessemer Venture Partners portfolio
  company and enriched from its live developer surface.
